name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: the deciding law against its falsifiable examples
        run: node --test brain.test.mjs

      - name: the derivation law (real records → day-state) against its examples
        run: node --test state.test.mjs

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the deciding law (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate brain.mjs \
            --timeout 60000 --cap 800 \
            --test node --test brain.test.mjs

      - name: witness — try to break the derivation law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate state.mjs \
            --timeout 60000 --cap 800 \
            --test node --test state.test.mjs

      - name: the drafting law (briefs + the guard) against its examples
        run: node --test draft.test.mjs

      - name: witness — try to break the drafting law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate draft.mjs \
            --timeout 60000 --cap 800 \
            --test node --test draft.test.mjs

      - name: the inbox law (enqueue / turnKey / pending) against its examples
        run: node --test inbox.test.mjs

      - name: witness — try to break the inbox law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate inbox.mjs \
            --timeout 60000 --cap 800 \
            --baseline witness.baseline.json \
            --test node --test inbox.test.mjs

      - name: the write-back law (approved keys → organ shapes) against its examples
        run: node --test writeback.test.mjs

      - name: witness — try to break the write-back law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate writeback.mjs \
            --timeout 60000 --cap 800 \
            --test node --test writeback.test.mjs

      - name: the live page still carries the gated law
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from brain.mjs — run node build-page.mjs and commit."
            exit 1
          }
